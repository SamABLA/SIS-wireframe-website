<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>ChainLink SIS — Wireframes</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  *{box-sizing:border-box;}
  body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:40px;
    color:#222;
    background:#fff;
  }
  a{
    color:#1155CC;
    text-decoration:underline;
    cursor:pointer;
  }

  /* Module list (Tab 1 style) */
  #module-list a{
    display:block;
    font-size:15px;
    margin-bottom:14px;
  }

  /* Module detail (Tab 2 style) */
  #module-detail{display:none;}
  #breadcrumb-header{
    margin-bottom:24px;
    font-size:15px;
  }
  #back-link{
    margin-right:14px;
    font-size:13px;
    color:#666;
  }
  #breadcrumb-text a{
    display:inline;
  }

  #module-frame{
    width:100%;
    height:80vh;
    border:1px solid #ccc;
    display:none;
  }
  #coming-soon{
    display:none;
    font-size:13px;
    color:#888;
    font-style:italic;
    border:1px dashed #ccc;
    padding:20px;
  }
</style>
</head>
<body>

  <!-- TAB 1: module list -->
  <div id="module-list">
    <a href="#" data-module="students">Students</a>
    <a href="#" data-module="staff">Staff</a>
    <a href="#" data-module="communication">Communication</a>
  </div>

  <!-- TAB 2: breadcrumb header + designated module/tab HTML -->
  <div id="module-detail">
    <div id="breadcrumb-header">
      <a href="#" id="back-link">&larr; Modules</a>
      <span id="breadcrumb-text"></span>
    </div>
    <iframe id="module-frame" title="Module content"></iframe>
    <div id="coming-soon">This module hasn't been wireframed yet.</div>
  </div>

  <script>
    // Each module points to the tab that should load below the breadcrumb.
    // Add more entries here (or more tabs per module) as new wireframes are built.
    const modules = {
      students: { label: "Students", tab: "Dashboard", file: "students-wireframe-lofi.html" },
      staff: { label: "Staff", tab: null, file: null },
      communication: { label: "Communication", tab: null, file: null },
    };

    const moduleList = document.getElementById('module-list');
    const moduleDetail = document.getElementById('module-detail');
    const breadcrumbText = document.getElementById('breadcrumb-text');
    const moduleFrame = document.getElementById('module-frame');
    const comingSoon = document.getElementById('coming-soon');
    const backLink = document.getElementById('back-link');

    document.querySelectorAll('[data-module]').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        showModule(link.dataset.module);
      });
    });

    function showModule(key) {
      const mod = modules[key];
      moduleList.style.display = 'none';
      moduleDetail.style.display = 'block';

      if (mod.file) {
        breadcrumbText.textContent = ' ' + mod.label + ' > ' + mod.tab;
        moduleFrame.src = mod.file;
        moduleFrame.style.display = 'block';
        comingSoon.style.display = 'none';
      } else {
        breadcrumbText.textContent = ' ' + mod.label;
        moduleFrame.style.display = 'none';
        moduleFrame.src = '';
        comingSoon.style.display = 'block';
      }
    }

    backLink.addEventListener('click', (e) => {
      e.preventDefault();
      moduleDetail.style.display = 'none';
      moduleList.style.display = 'block';
    });
  </script>

</body>
</html>
